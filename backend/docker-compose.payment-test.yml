name: handygo-payment-test

# Isolated, throwaway PostgreSQL for Payment integration tests (data lives in tmpfs).
services:
  postgres-test:
    image: postgres:16-alpine
    container_name: handygo-payment-test
    environment:
      POSTGRES_USER: handygo_test
      POSTGRES_PASSWORD: handygo_test_pw
      POSTGRES_DB: handygo_hg51_payment_test
    ports:
      - '127.0.0.1:55433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U handygo_test -d handygo_hg51_payment_test']
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
