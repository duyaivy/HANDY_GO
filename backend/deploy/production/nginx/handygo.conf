# Workflow defaults to handygo.duyaivy.id.vn; API_DOMAIN is rendered by the release builder.
# Runtime config is shipped automatically. Provision the TLS certificate before the first deploy.
log_format handygo '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent $request_time $upstream_response_time';
limit_req_zone $binary_remote_addr zone=handygo_api:2m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=handygo_conn:2m;
map $http_upgrade $handygo_connection { default upgrade; '' close; }
server_tokens off;

server {
    listen 8080 default_server;
    server_name _;
    location = /edge-health { access_log off; return 200 "ok\n"; }
    location / { return 444; }
}
server {
    listen 8080;
    server_name API_DOMAIN;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://API_DOMAIN$request_uri; }
}
server {
    listen 8443 ssl default_server;
    ssl_reject_handshake on;
}
server {
    listen 8443 ssl;
    server_name API_DOMAIN;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:handygo_tls:2m;
    ssl_session_timeout 1d;
    access_log /dev/stdout handygo;
    error_log /dev/stderr warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 12m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req zone=handygo_api burst=40 nodelay;
    limit_conn handygo_conn 8;

    location ~ ^/(docs|dev)(/|-|$) { return 404; }
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway http://api-gateway:3000;
        # Preserve the original path, including /api/v1; Nest owns the API prefix.
        proxy_pass $gateway;
        proxy_http_version 1.1;
        # Avoid buffering concurrent uploads into the 16 MiB container tmpfs.
        proxy_request_buffering off;
        proxy_set_header Host $host;
        # Overwrite client-supplied forwarding headers. Do not append XFF.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded '';
        proxy_set_header X-Internal-Secret '';
        proxy_set_header X-User-Id '';
        proxy_set_header X-User-Account-Id '';
        proxy_set_header X-User-Roles '';
        proxy_set_header X-User-Permissions '';
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $handygo_connection;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
