name: handygo

x-app: &app
  image: ${APP_IMAGE:?Digest reference required}
  profiles: [disabled]
  env_file:
    - path: ${APP_ENV_FILE:?Shared application ENV required}
      format: raw
  init: true
  restart: unless-stopped
  user: '1000:1000'
  read_only: true
  tmpfs: ['/tmp:size=16m,mode=1777']
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 100
  cpus: '0.75'
  stop_grace_period: 30s
  logging: &logging
    driver: json-file
    options: {max-size: '5m', max-file: '3'}
  healthcheck:
    test: ['CMD-SHELL', 'curl --fail --silent --max-time 2 http://127.0.0.1:$${PORT}/health >/dev/null']
    interval: 30s
    timeout: 4s
    retries: 3
    start_period: 90s

services:
  nginx:
    image: ${NGINX_IMAGE:?Digest reference required}
    profiles: [vps1]
    networks:
      default: {ipv4_address: 172.30.1.10}
    restart: unless-stopped
    user: '101:101'
    entrypoint: [nginx]
    command: ['-g', 'daemon off;']
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:size=16m,mode=1777']
    mem_limit: 32m
    memswap_limit: 32m
    cpus: '0.25'
    pids_limit: 32
    ports: ['80:8080', '443:8443']
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/handygo.conf:/etc/nginx/conf.d/handygo.conf:ro
      - /opt/handygo/tls:/etc/nginx/tls:ro
      - /opt/handygo/acme:/var/www/certbot:ro
    logging: *logging
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/edge-health']
      interval: 30s
      timeout: 3s
      retries: 3
  api-gateway:
    <<: *app
    profiles: [vps1]
    command: [node, dist/apps/api-gateway/main.js]
    environment: {PORT: '3000', NODE_OPTIONS: '--max-old-space-size=80'}
    mem_limit: 160m
    memswap_limit: 160m
  auth-service:
    <<: *app
    profiles: [vps1]
    command: [node, dist/apps/auth-service/main.js]
    environment: {PORT: '3001', NODE_OPTIONS: '--max-old-space-size=112'}
    mem_limit: 208m
    memswap_limit: 208m
  user-trust-service:
    <<: *app
    profiles: [vps1]
    command: [node, dist/apps/user-trust-service/main.js]
    environment: {PORT: '3002', NODE_OPTIONS: '--max-old-space-size=96'}
    mem_limit: 176m
    memswap_limit: 176m
  notification-service:
    <<: *app
    profiles: [vps1]
    command: [node, dist/apps/notification-service/main.js]
    environment: {PORT: '3008', NODE_OPTIONS: '--max-old-space-size=64'}
    mem_limit: 128m
    memswap_limit: 128m
  order-service:
    <<: *app
    profiles: [vps2]
    command: [node, dist/apps/order-service/main.js]
    environment: {PORT: '3004', NODE_OPTIONS: '--max-old-space-size=64'}
    mem_limit: 128m
    memswap_limit: 128m
    ports: ['${PRIVATE_IP:?WireGuard IP required}:3004:3004']
  bidding-service:
    <<: *app
    profiles: [vps2]
    command: [node, dist/apps/bidding-service/main.js]
    environment: {PORT: '3005', NODE_OPTIONS: '--max-old-space-size=56'}
    mem_limit: 112m
    memswap_limit: 112m
    ports: ['${PRIVATE_IP:?WireGuard IP required}:3005:3005']
  matching-service:
    <<: *app
    profiles: [vps2]
    command: [node, dist/apps/matching-service/main.js]
    environment: {PORT: '3006', NODE_OPTIONS: '--max-old-space-size=80'}
    mem_limit: 160m
    memswap_limit: 160m
    ports: ['${PRIVATE_IP:?WireGuard IP required}:3006:3006']
  tracking-service:
    <<: *app
    profiles: [vps2]
    command: [node, dist/apps/tracking-service/main.js]
    environment: {PORT: '3010', NODE_OPTIONS: '--max-old-space-size=64'}
    mem_limit: 128m
    memswap_limit: 128m
    ports: ['${PRIVATE_IP:?WireGuard IP required}:3010:3010']
  payment-service:
    <<: *app
    profiles: [vps3]
    command: [node, dist/apps/payment-service/main.js]
    environment: {PORT: '3007', NODE_OPTIONS: '--max-old-space-size=56'}
    mem_limit: 112m
    memswap_limit: 112m
    ports: ['${PRIVATE_IP:?WireGuard IP required}:3007:3007']
  wallet-service:
    <<: *app
    profiles: [vps3]
    command: [node, dist/apps/wallet-service/main.js]
    environment: {PORT: '3009', NODE_OPTIONS: '--max-old-space-size=56'}
    mem_limit: 112m
    memswap_limit: 112m
    ports: ['${PRIVATE_IP:?WireGuard IP required}:3009:3009']
  catalog-service:
    <<: *app
    profiles: [vps3]
    command: [node, dist/apps/catalog-service/main.js]
    environment: {PORT: '3003', NODE_OPTIONS: '--max-old-space-size=128'}
    mem_limit: 224m
    memswap_limit: 224m
    ports: ['${PRIVATE_IP:?WireGuard IP required}:3003:3003']

networks:
  default:
    ipam:
      config: [{subnet: 172.30.1.0/24, gateway: 172.30.1.1}]
