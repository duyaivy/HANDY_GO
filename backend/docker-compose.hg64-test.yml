name: hg64-integration

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.hg64-test
  image: hg64-integration-app:local
  environment: &app-env
    NODE_ENV: test
    API_PREFIX: api/v1
    DATABASE_URL: postgresql://hg64:hg64_local_test@postgres:5432/hg64
    DATABASE_URL_ORDER: postgresql://hg64:hg64_local_test@postgres:5432/hg64?schema=order_service
    DATABASE_URL_TRACKING: postgresql://hg64:hg64_local_test@postgres:5432/hg64?schema=tracking_service
    RABBITMQ_URL: amqp://hg64:hg64_local_test@rabbitmq:5672
    REDIS_URL: redis://redis:6379
    INTERNAL_SERVICE_SECRET: hg64-integration-only-secret
    CLOUDINARY_CLOUD_NAME: hg64-test
    CLOUDINARY_API_KEY: test-key
    CLOUDINARY_API_SECRET: test-secret
  init: true

x-http-health: &http-health
  test: [CMD, node, -e, "const p=process.env.PORT;fetch('http://127.0.0.1:'+p+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 5s
  timeout: 3s
  retries: 24
  start_period: 20s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hg64
      POSTGRES_PASSWORD: hg64_local_test
      POSTGRES_DB: hg64
    ports: ['55440:5432']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U hg64 -d hg64']
      interval: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: hg64
      RABBITMQ_DEFAULT_PASS: hg64_local_test
    ports: ['5673:5672']
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ['6380:6379']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      retries: 20

  migrate:
    <<: *app
    command: [sh, -c, 'pnpm run prisma:migrate:order && pnpm run prisma:migrate:tracking']
    depends_on:
      postgres: { condition: service_healthy }

  order-service:
    <<: *app
    command: [node, dist/apps/order-service/main.js]
    environment:
      <<: *app-env
      PORT: '3004'
      ORDER_ENABLE_MOCK_VERIFIER: 'true'
    ports: ['3304:3004']
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
    healthcheck: *http-health

  tracking-service:
    <<: *app
    command: [node, dist/apps/tracking-service/main.js]
    environment:
      <<: *app-env
      PORT: '3010'
    ports: ['3310:3010']
    depends_on:
      migrate: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: *http-health

  api-gateway:
    <<: *app
    command: [node, dist/apps/api-gateway/main.js]
    environment:
      <<: *app-env
      PORT: '3000'
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt-public.pem
      AUTH_SERVICE_URL: http://order-service:3004
      USER_TRUST_SERVICE_URL: http://order-service:3004
      CATALOG_SERVICE_URL: http://order-service:3004
      ORDER_SERVICE_URL: http://order-service:3004
      BIDDING_SERVICE_URL: http://order-service:3004
      MATCHING_SERVICE_URL: http://order-service:3004
      PAYMENT_SERVICE_URL: http://order-service:3004
      NOTIFICATION_SERVICE_URL: http://order-service:3004
      WALLET_SERVICE_URL: http://order-service:3004
      TRACKING_SERVICE_URL: http://tracking-service:3010
      AI_SERVICE_URL: http://order-service:3004
    volumes:
      - ./keys/jwt-public.pem:/run/keys/jwt-public.pem:ro
    ports: ['3300:3000']
    depends_on:
      order-service: { condition: service_healthy }
      tracking-service: { condition: service_healthy }
    healthcheck: *http-health
