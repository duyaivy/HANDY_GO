name: handy-go-backend

x-app: &app
  image: handy-go-backend-dev:local
  pull_policy: never
  init: true
  restart: unless-stopped
  working_dir: /app
  command:
    - sh
    - -c
    - >-
      exec pnpm exec nodemon
      --watch "apps/$$NEST_PROJECT"
      --watch libs
      --watch nest-cli.json
      --watch tsconfig.json
      --ext ts,json
      --delay 300ms
      --exec "pnpm exec nest start $$NEST_PROJECT"
  volumes:
    - ./apps:/app/apps
    - ./libs:/app/libs
    - ./nest-cli.json:/app/nest-cli.json:ro
    - ./tsconfig.json:/app/tsconfig.json:ro
    - ./tsconfig.build.json:/app/tsconfig.build.json:ro
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - >-
        const http=require('node:http');
        const request=http.get({host:'127.0.0.1',port:process.env.PORT,path:'/health'},
        response=>process.exit(response.statusCode===200?0:1));
        request.on('error',()=>process.exit(1));
        request.setTimeout(2000,()=>{request.destroy();process.exit(1)});
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 30s

x-development-environment: &development-environment
  NODE_ENV: development
  LOG_LEVEL: debug
  API_PREFIX: api/v1
  CORS_ORIGIN: http://localhost:5173
  CHOKIDAR_USEPOLLING: "true"
  CHOKIDAR_INTERVAL: "500"
  WATCHPACK_POLLING: "true"

services:
  api-gateway:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      <<: *development-environment
      NEST_PROJECT: api-gateway
      PORT: "3000"
      UPSTREAM_TIMEOUT_MS: "15000"
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_TRUST_SERVICE_URL: http://user-trust-service:3002
      CATALOG_SERVICE_URL: http://catalog-service:3003
      ORDER_SERVICE_URL: http://order-service:3004
      BIDDING_SERVICE_URL: http://bidding-service:3005
      MATCHING_SERVICE_URL: http://matching-service:3006
      PAYMENT_SERVICE_URL: http://payment-service:3007
      NOTIFICATION_SERVICE_URL: http://notification-service:3008
      WALLET_SERVICE_URL: http://wallet-service:3009
      TRACKING_SERVICE_URL: http://tracking-service:3010
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-handy-go-internal-service-secret-key-12345}
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_healthy
      user-trust-service:
        condition: service_healthy

  auth-service:
    <<: *app
    environment:
      <<: *development-environment
      NEST_PROJECT: auth-service
      PORT: "3001"
      DATABASE_URL_AUTH: ${DATABASE_URL_AUTH:-postgresql://postgres:postgres@postgres-auth:5432/handy_auth}
      RABBITMQ_URL: amqp://handygo:handygo@rabbitmq:5672
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_FROM: ${SMTP_FROM:-HANDY GO <social.huynhducthinh@gmail.com>}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      OTP_SECRET: ${OTP_SECRET:-handy-go-otp-secret-key-development-32-chars-long}
      OTP_EXPIRATION_MINUTES: ${OTP_EXPIRATION_MINUTES:-10}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-handy-go-internal-service-secret-key-12345}
      JWT_PRIVATE_KEY_PATH: /app/keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt-public.pem
    volumes:
      - ./apps:/app/apps
      - ./libs:/app/libs
      - ./nest-cli.json:/app/nest-cli.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.build.json:/app/tsconfig.build.json:ro
      - ./keys/jwt-private.pem:/app/keys/jwt-private.pem:ro
      - ./keys/jwt-public.pem:/app/keys/jwt-public.pem:ro
    depends_on:
      postgres-auth:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy


  user-trust-service:
    <<: *app
    environment:
      <<: *development-environment
      NEST_PROJECT: user-trust-service
      PORT: "3002"
      DATABASE_URL_USER_TRUST: ${DATABASE_URL_USER_TRUST:-postgresql://postgres:postgres@postgres-user-trust:5432/handy_user_trust}
      RABBITMQ_URL: amqp://handygo:handygo@rabbitmq:5672
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt-public.pem
    volumes:
      - ./apps:/app/apps
      - ./libs:/app/libs
      - ./nest-cli.json:/app/nest-cli.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.build.json:/app/tsconfig.build.json:ro
      - ./keys/jwt-public.pem:/app/keys/jwt-public.pem:ro
    ports:
      - "3002:3002"
    depends_on:
      postgres-user-trust:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  catalog-service:
    <<: *app
    profiles: ["all"]
    environment:
      <<: *development-environment
      NEST_PROJECT: catalog-service
      PORT: "3003"
    ports:
      - "3003:3003"

  order-service:
    <<: *app
    profiles: ["all"]
    environment:
      <<: *development-environment
      NEST_PROJECT: order-service
      PORT: "3004"
    ports:
      - "3004:3004"

  bidding-service:
    <<: *app
    profiles: ["all"]
    environment:
      <<: *development-environment
      NEST_PROJECT: bidding-service
      PORT: "3005"
    ports:
      - "3005:3005"

  matching-service:
    <<: *app
    profiles: ["all"]
    environment:
      <<: *development-environment
      NEST_PROJECT: matching-service
      PORT: "3006"
    ports:
      - "3006:3006"

  payment-service:
    <<: *app
    profiles: ["all"]
    environment:
      <<: *development-environment
      NEST_PROJECT: payment-service
      PORT: "3007"
    ports:
      - "3007:3007"

  notification-service:
    <<: *app
    profiles: ["all"]
    environment:
      <<: *development-environment
      NEST_PROJECT: notification-service
      PORT: "3008"
    ports:
      - "3008:3008"

  wallet-service:
    <<: *app
    profiles: ["all"]
    environment:
      <<: *development-environment
      NEST_PROJECT: wallet-service
      PORT: "3009"
    ports:
      - "3009:3009"

  tracking-service:
    <<: *app
    profiles: ["all"]
    environment:
      <<: *development-environment
      NEST_PROJECT: tracking-service
      PORT: "3010"
    ports:
      - "3010:3010"


  postgres-auth:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: handy_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d handy_auth"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-user-trust:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: handy_user_trust
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-user-trust-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d handy_user_trust"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: handygo
      RABBITMQ_DEFAULT_PASS: handygo
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-auth-data:
  postgres-user-trust-data:
  rabbitmq-data:


