    ports:
      - "3003:3003"

  order-service:
    <<: *app
    environment:
      <<: *development-environment
      NEST_PROJECT: order-service
      PORT: "3004"
    ports:
      - "3004:3004"

  bidding-service:
    <<: *app
    environment:
      <<: *development-environment
      NEST_PROJECT: bidding-service
      PORT: "3005"
    ports:
      - "3005:3005"

  matching-service:
    <<: *app
    environment:
      <<: *development-environment
      NEST_PROJECT: matching-service
      PORT: "3006"
    ports:
      - "3006:3006"

  payment-service:
    <<: *app
    environment:
      <<: *development-environment
      NEST_PROJECT: payment-service
      PORT: "3007"
    ports:
      - "3007:3007"

  notification-service:
    <<: *app
    environment:
      <<: *development-environment
      NEST_PROJECT: notification-service
      PORT: "3008"
    ports:
      - "3008:3008"

  wallet-service:
