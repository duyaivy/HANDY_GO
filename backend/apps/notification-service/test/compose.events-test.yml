name: handygo-notification-phase2-test
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: notification_test
      POSTGRES_PASSWORD: notification_test
      POSTGRES_DB: notification_test
    ports:
      - "127.0.0.1:55438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.2-alpine
    environment:
      RABBITMQ_DEFAULT_USER: notification_test
      RABBITMQ_DEFAULT_PASS: notification_test
      RABBITMQ_DEFAULT_VHOST: notification_test
    ports:
      - "127.0.0.1:56738:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
