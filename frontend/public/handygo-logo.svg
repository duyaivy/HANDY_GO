<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <!-- Vibrant orange gradient matching the uploaded HandyGo logo -->
    <linearGradient id="handyOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E16" />
      <stop offset="35%" stop-color="#FF720E" />
      <stop offset="100%" stop-color="#FF4D00" />
    </linearGradient>

    <!-- Gradient specifically for the 'Go' text -->
    <linearGradient id="goTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5200" />
      <stop offset="100%" stop-color="#FF9914" />
    </linearGradient>
  </defs>

  <!-- ==================== TOP ICON MARK ==================== -->
  <g id="logo-mark" transform="translate(150, 8)">
    <!-- 3 Speed Lines on the left -->
    <!-- Top Speed Line -->
    <rect x="-70" y="38" width="58" height="15" rx="7.5" fill="url(#handyOrangeGrad)" />
    <!-- Middle Speed Line (Shorter Dash) -->
    <rect x="-92" y="65" width="40" height="15" rx="7.5" fill="url(#handyOrangeGrad)" />
    <!-- Bottom Speed Line -->
    <rect x="-66" y="92" width="52" height="15" rx="7.5" fill="url(#handyOrangeGrad)" />

    <!-- Location Pin Outer Shape -->
    <!-- Pin Circle center around (150, 72), radius ~ 68. Bottom tip extends to (150, 156) -->
    <path d="M 150 4
             C 192 4 218 36 218 78
             C 218 108 185 142 150 162
             C 115 142 82 108 82 78
             C 82 36 108 4 150 4 Z"
          fill="url(#handyOrangeGrad)" />

    <!-- Inner Circle Cutout (White background for house) -->
    <circle cx="150" cy="74" r="48" fill="#ffffff" />

    <!-- House Icon inside Pin -->
    <!-- House Roof Chevron (Dark Slate #1E2530) -->
    <path d="M 150 45 L 178 69 L 168 77 L 150 62 L 132 77 L 122 69 Z"
          fill="#1E2530" />

    <!-- 4 Square Windows (2x2 Grid) -->
    <rect x="135" y="80" width="12" height="12" rx="1.5" fill="#1E2530" />
    <rect x="153" y="80" width="12" height="12" rx="1.5" fill="#1E2530" />
    <rect x="135" y="96" width="12" height="12" rx="1.5" fill="#1E2530" />
    <rect x="153" y="96" width="12" height="12" rx="1.5" fill="#1E2530" />
  </g>

  <!-- ==================== BRAND WORDMARK ==================== -->
  <g id="wordmark" transform="translate(300, 236)" text-anchor="middle">
    <!-- "Handy" in dark slate and "Go" in orange gradient -->
    <text font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif"
          font-weight="900"
          font-size="64"
          letter-spacing="-1.5">
      <tspan fill="#1E2530" x="-10">Handy</tspan><tspan fill="url(#goTextGrad)" dx="2">Go</tspan>
    </text>
  </g>

  <!-- ==================== SLOGAN ==================== -->
  <g id="slogan" transform="translate(300, 270)">
    <!-- Left Divider Line -->
    <line x1="-240" y1="-5" x2="-180" y2="-5" stroke="#4A5568" stroke-width="1.8" stroke-linecap="round" />

    <!-- Slogan Text -->
    <text x="0" y="0"
          text-anchor="middle"
          fill="#4A5568"
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif"
          font-weight="700"
          font-size="13.5"
          letter-spacing="2.8">
      DỊCH VỤ TẬN NƠI, TRONG TẦM TAY
    </text>

    <!-- Right Divider Line -->
    <line x1="180" y1="-5" x2="240" y2="-5" stroke="#4A5568" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
