appId: ${APP_ID}
name: Customer verifies settled order and hidden charge action
---
- openLink: handygo://customer/orders/${ORDER_ID}
- extendedWaitUntil:
    visible:
      id: orders-customer-detail-screen
    timeout: 30000
- scrollUntilVisible:
    element:
      text: Đã thanh toán
    direction: UP
    centerElement: true
- assertVisible: Đã thanh toán
- assertNotVisible:
    id: customer-retry-payment-btn
- takeScreenshot: customer-order-paid
