appId: ${APP_ID}
name: Worker withdrawal against deployed backend
---
- runFlow: bootstrap.yaml
- tapOn:
    id: worker-wallet-withdraw-btn
- extendedWaitUntil:
    visible:
      id: withdraw-available
    timeout: 30000
- runFlow:
    when:
      visible: 'Chưa có tài khoản ngân hàng.*'
    commands:
      - tapOn:
          id: withdraw-add-bank-btn
      - scrollUntilVisible:
          element:
            id: withdraw-bank-code-input
          direction: DOWN
          centerElement: true
      - tapOn:
          id: withdraw-bank-code-input
      - inputText: ${BANK_CODE}
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: withdraw-bank-name-input
          direction: DOWN
          centerElement: true
      - tapOn:
          id: withdraw-bank-name-input
      - inputText: ${BANK_NAME}
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: withdraw-bank-number-input
          direction: DOWN
          centerElement: true
      - tapOn:
          id: withdraw-bank-number-input
      - inputText: ${BANK_NUMBER}
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: withdraw-bank-holder-input
          direction: DOWN
          centerElement: true
      - tapOn:
          id: withdraw-bank-holder-input
      - inputText: ${BANK_HOLDER}
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: withdraw-bank-save-btn
          direction: DOWN
          centerElement: true
      - tapOn:
          id: withdraw-bank-save-btn
      - extendedWaitUntil:
          notVisible:
            id: withdraw-bank-save-btn
          timeout: 30000
- scrollUntilVisible:
    element:
      id: withdraw-amount-input
    direction: DOWN
    centerElement: true
- tapOn:
    id: withdraw-amount-input
- eraseText
- inputText: ${WITHDRAW_AMOUNT}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: withdraw-confirm-btn
    direction: DOWN
    centerElement: true
- takeScreenshot: withdraw-before-submit
- tapOn:
    id: withdraw-confirm-btn
- extendedWaitUntil:
    visible: Đã ghi nhận yêu cầu
    timeout: 30000
- tapOn: OK
- scrollUntilVisible:
    element:
      text: Lệnh rút gần đây
    direction: DOWN
    centerElement: true
- takeScreenshot: withdraw-after-submit
