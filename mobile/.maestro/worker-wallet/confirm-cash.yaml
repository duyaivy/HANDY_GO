appId: ${APP_ID}
name: Worker confirms cash on a completed test order
---
- runFlow: bootstrap.yaml
- openLink: handygo://worker/jobs/${ORDER_ID}
- extendedWaitUntil:
    visible:
      id: worker-confirm-cash-btn
    timeout: 30000
- tapOn:
    id: worker-confirm-cash-btn
- assertVisible: Xác nhận nhận tiền mặt
- tapOn: Chưa nhận
- assertVisible:
    id: worker-confirm-cash-btn
- tapOn:
    id: worker-confirm-cash-btn
- tapOn: Đã nhận đủ tiền
- extendedWaitUntil:
    visible: Đã xác nhận nhận tiền mặt
    timeout: 30000
- assertNotVisible:
    id: worker-confirm-cash-btn
- takeScreenshot: cash-confirmed
