appId: ${APP_ID}
name: Worker wallet navigation and validation
---
- runFlow: bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: worker-wallet-available
    timeout: 30000
- takeScreenshot: wallet-before
- tapOn:
    id: worker-wallet-privacy-btn
- assertVisible: ••••••
- tapOn:
    id: worker-wallet-privacy-btn
- tapOn:
    id: worker-wallet-deposit-btn
- assertVisible:
    id: wallet-deposit-screen
- tapOn:
    id: worker-deposit-amount-2000000
- tapOn:
    id: worker-deposit-open-btn
- assertVisible:
    id: topup-amount-input
- assertVisible: 2.000.000
- tapOn:
    id: topup-close-btn
- tapOn:
    id: app-bar-back-btn
- tapOn:
    id: worker-wallet-details-btn
- assertVisible:
    id: worker-balance-screen
- assertVisible: 'Tổng số dư ví: .*'
- tapOn:
    id: app-bar-back-btn
- tapOn:
    id: worker-wallet-withdraw-btn
- extendedWaitUntil:
    visible:
      id: withdraw-available
    timeout: 30000
- scrollUntilVisible:
    element:
      id: withdraw-amount-input
    direction: DOWN
    centerElement: true
- tapOn:
    id: withdraw-amount-input
- inputText: '49000'
- hideKeyboard
- assertVisible: Số tiền rút tối thiểu là 50.000 đ.
- takeScreenshot: withdraw-minimum-validation
- tapOn:
    id: app-bar-back-btn
- scrollUntilVisible:
    element:
      id: worker-wallet-history-btn
    direction: DOWN
    centerElement: true
- tapOn:
    id: worker-wallet-history-btn
- assertVisible:
    id: worker-transaction-history-screen
- takeScreenshot: worker-history
