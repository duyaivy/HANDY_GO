appId: com.android.chrome
name: VNPAY official NCB sandbox card
---
# Public sandbox card from https://sandbox.vnpayment.vn/apis/vnpay-demo/
- assertVisible: '.*sandbox.vnpayment.vn.*'
- tapOn:
    id: card_number_mask
- inputText: '9704198526191432198'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: cardHolder
    direction: DOWN
    centerElement: true
- tapOn:
    id: cardHolder
- inputText: NGUYEN VAN A
- hideKeyboard
- scrollUntilVisible:
    element:
      id: cardDate
    direction: DOWN
    centerElement: true
- tapOn:
    id: cardDate
- inputText: '0715'
- hideKeyboard
- scrollUntilVisible:
    element:
      text: Tiếp tục
    direction: DOWN
    centerElement: true
- tapOn: Tiếp tục
- takeScreenshot: vnpay-after-card
