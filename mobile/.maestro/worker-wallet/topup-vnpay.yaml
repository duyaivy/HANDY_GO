appId: ${APP_ID}
name: Worker VNPAY sandbox checkout
---
- runFlow: bootstrap.yaml
- extendedWaitUntil:
    visible:
      id: worker-wallet-available
    timeout: 30000
- takeScreenshot: wallet-before-topup
- tapOn:
    id: worker-wallet-deposit-btn
- tapOn:
    id: worker-deposit-amount-200000
- tapOn:
    id: worker-deposit-open-btn
- tapOn:
    id: topup-vnpay-btn
- extendedWaitUntil:
    visible: 'sandbox.vnpayment.vn.*'
    timeout: 30000
- takeScreenshot: vnpay-sandbox-checkout
