appId: ${APP_ID}
name: Worker receives exact November order earnings
---
- openLink: handygo://worker/wallet
- extendedWaitUntil:
    visible:
      id: worker-wallet-available
      text: 5.699.999 đ
    timeout: 30000
- takeScreenshot: worker-wallet-after-settlement
- scrollUntilVisible:
    element:
      id: transaction-item-30173e93-1e99-4c07-be31-f98d49a84c3f
    direction: DOWN
    centerElement: true
- tapOn:
    id: transaction-item-30173e93-1e99-4c07-be31-f98d49a84c3f
- assertVisible: '.*499.999.*'
- takeScreenshot: worker-earning-ledger
