services:
  # ============================================================================
  # AI HTTP Service (FastAPI)
  # Nhận request eKYC, lưu ảnh đệm tạm thời, đẩy job vào Cloud Redis & trả status
  # ============================================================================
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: handygo-ai-service
    init: true
    restart: unless-stopped
    mem_limit: 800m
    mem_reservation: 400m
    environment:
      AI_SERVICE_PORT: ${AI_SERVICE_PORT:-8000}
      # Cloud Redis (Upstash / Redis Cloud - dùng tiền tố rediss://)
      AI_REDIS_URL: ${AI_REDIS_URL:-${REDIS_URL:-}}
      REDIS_URL: ${AI_REDIS_URL:-${REDIS_URL:-}}
      # Cloud RabbitMQ (CloudAMQP - dùng tiền tố amqps://)
      RABBITMQ_URL: ${RABBITMQ_URL:-}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-handy-go.events}
      # Security Keys
      ADMIN_API_KEY: ${ADMIN_API_KEY:-handy-go-admin-secret-key-12345}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-handy-go-internal-service-secret-key-12345}
      DEBUG: ${AI_SERVICE_DEBUG:-false}
      # Cloud Storage (Cloudinary - Toàn bộ ảnh kết quả được lưu trữ tại đây)
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-identity_verifications}
      CLOUDINARY_DELIVERY_TYPE: ${CLOUDINARY_DELIVERY_TYPE:-upload}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
      # ai-storage chỉ là bộ đệm chia sẻ file tạm giữa ai-service và ai-worker
      - ai-storage:/app/storage
      # Cache models để không phải tải lại mỗi lần khởi động
      - ai-face-models:/home/app/.insightface
      - ai-ocr-models:/home/app/.EasyOCR
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.getenv('AI_SERVICE_PORT','8000')+'/health',timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  # ============================================================================
  # AI Heavy Task Worker (Celery)
  # Nhận job từ Cloud Redis -> OCR CCCD -> Đối sánh khuôn mặt -> Upload Cloudinary -> Bắn event Cloud RabbitMQ
  # ============================================================================
  ai-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: handygo-ai-worker
    command: ["celery", "-A", "app.domains.identity.tasks.identity_tasks:celery_app", "worker", "--loglevel=INFO", "--pool=solo"]
    init: true
    restart: unless-stopped
    mem_limit: 2500m
    memswap_limit: 4000m
    mem_reservation: 800m
    environment:
      # Memory & Thread limits để tối ưu CPU và tránh nghẽn
      MALLOC_TRIM_THRESHOLD_: "65536"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      VECLIB_MAXIMUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
      AI_SERVICE_PORT: ${AI_SERVICE_PORT:-8000}
      # Cloud Redis (Upstash / Redis Cloud)
      AI_REDIS_URL: ${AI_REDIS_URL:-${REDIS_URL:-}}
      REDIS_URL: ${AI_REDIS_URL:-${REDIS_URL:-}}
      # Cloud RabbitMQ (CloudAMQP)
      RABBITMQ_URL: ${RABBITMQ_URL:-}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-handy-go.events}
      # Security Keys
      ADMIN_API_KEY: ${ADMIN_API_KEY:-handy-go-admin-secret-key-12345}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-handy-go-internal-service-secret-key-12345}
      DEBUG: ${AI_SERVICE_DEBUG:-false}
      # Cloud Storage (Cloudinary)
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-identity_verifications}
      CLOUDINARY_DELIVERY_TYPE: ${CLOUDINARY_DELIVERY_TYPE:-upload}
    volumes:
      - ./app:/app/app
      - ai-storage:/app/storage
      - ai-face-models:/home/app/.insightface
      - ai-ocr-models:/home/app/.EasyOCR
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - celery
        - -A
        - app.domains.identity.tasks.identity_tasks:celery_app
        - inspect
        - ping

  # ============================================================================
  # (TÙY CHỌN) Local Redis - Chỉ chạy khi dùng cờ `--profile local`
  # Không cần thiết nếu bạn đã dùng Cloud Redis (Upstash)
  # ============================================================================
  ai-redis:
    profiles:
      - local
    image: redis:7-alpine
    container_name: handygo-ai-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ai-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ai-storage:
  ai-face-models:
  ai-ocr-models:
  ai-redis-data:
