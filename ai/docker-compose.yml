services:
  # ============================================================================
  # AI Inference HTTP Service (FastAPI)
  # Cung cấp API inference độc lập cho OCR thẻ CCCD và đối sánh khuôn mặt.
  # BE Worker gọi trực tiếp qua HTTP POST /internal/v1/identity/analyze.
  # Hoàn toàn độc lập với Backend, không dùng chung Redis/Celery/RabbitMQ/Storage.
  # ============================================================================
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: handygo-ai-service
    init: true
    restart: unless-stopped
    mem_limit: 1500m
    mem_reservation: 500m
    environment:
      AI_SERVICE_PORT: ${AI_SERVICE_PORT:-8000}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-handy-go-internal-service-secret-key-12345}
      DEBUG: ${AI_SERVICE_DEBUG:-false}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app
      # Cache models để không phải tải lại mỗi lần khởi động
      - ai-face-models:/home/app/.insightface
      - ai-ocr-models:/home/app/.EasyOCR
      - ai-hf-models:/home/app/.cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.getenv('AI_SERVICE_PORT','8000')+'/health',timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  ai-face-models:
  ai-ocr-models:
  ai-hf-models:
