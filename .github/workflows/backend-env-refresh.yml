name: Backend production - refresh ENV only

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Refresh ENV or retry recovery of an earlier ENV refresh'
        required: true
        type: choice
        options: [refresh, recover, sandbox-enable, sandbox-disable, sandbox-diagnose, sandbox-november-plan, sandbox-november-apply, sandbox-snapshots-plan, sandbox-snapshots-apply]
        default: refresh
      recovery_run_id:
        description: 'Original failed ENV refresh run ID (recover mode only)'
        required: false
        type: string
      recovery_attempt:
        description: 'Original failed run attempt, usually 1 (recover mode only)'
        required: false
        type: string
      confirm:
        description: 'REFRESH_ALL, RECOVER_ENV, or SANDBOX_ONLY for payment/wallet sandbox'
        required: true
        type: string
      sandbox_outcome:
        description: 'Simulated payout outcome (sandbox-enable only)'
        type: choice
        options: [succeeded, failed]
        default: succeeded

permissions:
  contents: read

# Held across refresh AND recovery; image releases use this same group.
concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  wallet-sandbox:
    if: startsWith(inputs.mode, 'sandbox-')
    name: Toggle payment and wallet sandbox on VPS3
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Apply reversible sandbox override to the accepted images
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          OUTCOME: ${{ inputs.sandbox_outcome }}
          VPS3_HOST: ${{ secrets.VPS3_HOST }}
          VPS3_SSH_KEY: ${{ secrets.VPS3_SSH_KEY }}
        run: |
          test "$GITHUB_REF" = refs/heads/release
          test "$CONFIRM" = SANDBOX_ONLY
          python3 - <<'PY'
          import json, os, re, shlex, subprocess, tempfile
          from pathlib import Path
          mode, outcome = os.environ['MODE'], os.environ.get('OUTCOME') or 'succeeded'
          if mode not in ('sandbox-enable', 'sandbox-disable', 'sandbox-diagnose', 'sandbox-november-plan', 'sandbox-november-apply', 'sandbox-snapshots-plan', 'sandbox-snapshots-apply') or outcome not in ('succeeded', 'failed'):
              raise SystemExit('Invalid sandbox operation')
          destination = os.environ['VPS3_HOST']
          if not re.fullmatch(r'[A-Za-z0-9.-]+', destination):
              raise SystemExit('Invalid VPS3 destination')
          directory = Path('backend/deploy/production')
          sources = {name: (directory / name).read_text() for name in ('host.py', 'release_log.py', 'services.json')}
          repair_source = Path('.github/scripts/hg71-november-payment-repair.mjs').read_text()
          snapshot_source = Path('.github/scripts/hg71-transaction-snapshot-repair.mjs').read_text()
          operation = r'''
          import fcntl, time
          targets = ('payment-service', 'wallet-service')
          with (ROOT / 'deploy.lock').open('a') as lock:
              fcntl.flock(lock, fcntl.LOCK_EX | fcntl.LOCK_NB)
              if (ROOT / 'pending.json').exists():
                  raise RuntimeError('Recover the pending deployment before changing sandbox mode')
              stable = read(ROOT / 'stable.json')
              if not stable:
                  raise RuntimeError('Accepted deployment required')
              host = Host('vps3', stable['release_id'])
              host.validate_bundle()
              if mode in ('sandbox-snapshots-plan', 'sandbox-snapshots-apply'):
                  receipt = read(ROOT / 'wallet-sandbox.json')
                  if not receipt or receipt.get('release_id') != stable['release_id'] or receipt.get('mode') != 'sandbox' or receipt.get('image') != host.manifest['app_image']:
                      raise RuntimeError('Current accepted sandbox receipt required')
                  container = host.compose('ps', '-q', 'wallet-service')
                  command = ['docker', 'exec', '-i',
                      '-e', 'HG71_VERIFIED_SANDBOX=1', '-e', 'HG71_SNAPSHOTS_RUN=1',
                      '-e', 'HG71_REPAIR_APPLY=' + ('1' if mode.endswith('apply') else '0'),
                      '-e', 'HG71_REPAIR_OPERATOR=' + repair_operator, '-e', 'HG71_REPAIR_RUN_ID=' + repair_run_id,
                      container, 'node', '--input-type=module']
                  result = subprocess.run(command, input=snapshot_source, text=True, capture_output=True, timeout=90)
                  emit('snapshot-repair', result.stdout)
                  if result.returncode:
                      emit('snapshot-repair', result.stderr)
                      raise RuntimeError('Snapshot repair refused or rolled back')
                  raise SystemExit(0)
              if mode in ('sandbox-november-plan', 'sandbox-november-apply'):
                  container = host.compose('ps', '-q', 'payment-service')
                  command = ['docker', 'exec', '-i',
                      '-e', 'HG71_REPAIR_RUN=1', '-e', 'HG71_REPAIR_APPLY=' + ('1' if mode.endswith('apply') else '0'),
                      '-e', 'HG71_REPAIR_ACTOR=d0d78b4a-afc9-4877-aad4-47a249b93a55',
                      '-e', 'HG71_REPAIR_OPERATOR=' + repair_operator, '-e', 'HG71_REPAIR_RUN_ID=' + repair_run_id,
                      container, 'node', '--input-type=module']
                  result = subprocess.run(command, input=repair_source, text=True, capture_output=True, timeout=90)
                  emit('november-repair', result.stdout)
                  if result.returncode:
                      emit('november-repair', result.stderr)
                      raise RuntimeError('November repair refused or rolled back')
                  raise SystemExit(0)
              if mode == 'sandbox-diagnose':
                  container = host.compose('ps', '-q', 'payment-service')
                  probe = """
          const {Client} = require('pg');
          const db = new Client({connectionString: process.env.DATABASE_URL_PAYMENT || process.env.DATABASE_URL});
          (async () => {
            await db.connect();
            console.log(JSON.stringify({nodeEnv:process.env.NODE_ENV, inboundRetry:process.env.PAYMENT_INBOUND_RETRY_ENABLED, reconciler:process.env.PAYMENT_RECONCILER_ENABLED, outbox:process.env.PAYMENT_OUTBOX_ENABLED}));
            for (const sql of [
              'select count(*)::text as payments from payment_service.payments',
              'select rate_percent::text,effective_from,effective_to,is_active from payment_service.commission_rules',
              'select event_type,status,attempts,last_error,count(*)::text as count from payment_service.failed_inbound_events group by event_type,status,attempts,last_error limit 12',
              'select event_type,count(*)::text as count from payment_service.consumed_events group by event_type'
            ]) console.log(JSON.stringify((await db.query(sql)).rows));
          })().catch(e => {console.error(e.name,e.code);process.exitCode=1}).finally(() => db.end());
          """
                  emit('sandbox-diagnostics', run(['docker', 'exec', container, 'node', '-e', probe], label='Read payment diagnostics'))
                  raise SystemExit(0)
              if not set(targets).issubset(host.names):
                  raise RuntimeError('Payment/wallet are not on VPS3')
              state_path = ROOT / 'wallet-sandbox.json'
              previous = read(state_path)
              if previous and previous.get('release_id') != stable['release_id']:
                  raise RuntimeError('Sandbox receipt belongs to another deployment; inspect it first')
              override = ROOT / 'wallet-sandbox.override.json'
              before = override.read_bytes() if override.exists() else None
              settings = {'services': {
                  'payment-service': {'environment': {'NODE_ENV': 'development', 'PAYOUT_MOCK_ENABLED': 'true', 'PAYOUT_MOCK_OUTCOME': outcome}},
                  'wallet-service': {'environment': {'WALLET_WITHDRAWALS_ENABLED': 'true'}},
              }}
              if mode == 'sandbox-enable':
                  write(override, settings)
              def recreate(use_override):
                  extra = ['-f', str(override)] if use_override else []
                  host.compose(*extra, 'up', '-d', '--no-build', '--no-deps', '--pull', 'never', '--force-recreate', *targets)
                  deadline = time.monotonic() + 240
                  while time.monotonic() < deadline:
                      snapshots = [host._container_snapshot(name) for name in targets]
                      if all(s and s.get('running') and s.get('health') == 'healthy' and not s.get('oom_killed') for s in snapshots):
                          return
                      time.sleep(5)
                  raise RuntimeError('Payment/wallet health check timed out')
              try:
                  recreate(mode == 'sandbox-enable')
                  if mode == 'sandbox-enable':
                      write(state_path, {'release_id': stable['release_id'], 'outcome': outcome, 'mode': 'sandbox', 'image': host.manifest['app_image']})
                  else:
                      state_path.unlink(missing_ok=True)
                      override.unlink(missing_ok=True)
              except BaseException:
                  if before is not None:
                      override.write_bytes(before)
                  else:
                      override.unlink(missing_ok=True)
                  recreate(previous is not None)
                  raise
              print(json.dumps({'mode': mode, 'outcome': outcome if mode == 'sandbox-enable' else None, 'services': targets, 'healthy': True}))
          '''
          bootstrap = (
              'import json,sys,types; p=json.load(sys.stdin); '
              'm=types.ModuleType("release_log"); exec(p["sources"]["release_log.py"],m.__dict__); sys.modules["release_log"]=m; '
              'd=types.ModuleType("deployment_services"); d.REGISTRY=json.loads(p["sources"]["services.json"])["services"]; sys.modules["deployment_services"]=d; '
              'n={"__name__":"sandbox_host","__file__":"trusted-sandbox-host.py","mode":p["mode"],"outcome":p["outcome"],"repair_source":p["repair_source"],"snapshot_source":p["snapshot_source"],"repair_operator":p["repair_operator"],"repair_run_id":p["repair_run_id"]}; '
              'exec(compile(p["sources"]["host.py"],"trusted-sandbox-host.py","exec"),n); exec(compile(p["operation"],"sandbox-operation.py","exec"),n)'
          )
          with tempfile.TemporaryDirectory() as temporary:
              key = Path(temporary) / 'vps3'
              key.touch(mode=0o600)
              key.write_text(os.environ['VPS3_SSH_KEY'] + '\n')
              command = ['ssh', '-i', str(key), '-o', 'BatchMode=yes', '-o', 'IdentitiesOnly=yes', '-o', 'ConnectTimeout=15',
                  '-o', 'StrictHostKeyChecking=accept-new', '-o', 'UserKnownHostsFile=' + str(Path(temporary) / 'known_hosts'),
                  'azureuser@' + destination, 'python3 -c ' + shlex.quote(bootstrap)]
              subprocess.run(command, input=json.dumps({'sources': sources, 'operation': operation, 'mode': mode, 'outcome': outcome, 'repair_source': repair_source, 'snapshot_source': snapshot_source, 'repair_operator': os.environ['GITHUB_ACTOR'], 'repair_run_id': os.environ['GITHUB_RUN_ID']}), text=True, check=True, timeout=650)
          PY

  refresh:
    if: inputs.mode == 'refresh'
    name: Refresh production ENV on all 4 VPS
    runs-on: ubuntu-24.04
    # Forward rollout has its own 30-minute budget; leave room for compensation.
    timeout-minutes: 180
    environment: production
    defaults:
      run:
        working-directory: backend
    env:
      VPS1_HOST: ${{ secrets.VPS1_HOST }}
      VPS2_HOST: ${{ secrets.VPS2_HOST }}
      VPS3_HOST: ${{ secrets.VPS3_HOST }}
      VPS4_HOST: ${{ secrets.VPS4_HOST }}
      DEPLOY_USER: azureuser
      API_DOMAIN: ${{ vars.API_DOMAIN || 'handygo.duyaivy.id.vn' }}
    steps:
      - uses: actions/checkout@v5
      - name: Confirm release branch and intentional all-service restart
        env:
          CONFIRM: ${{ inputs.confirm }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REF" = refs/heads/release
          if [[ "$CONFIRM" != 'REFRESH_ALL' ]]; then
            echo '::error::Type REFRESH_ALL to authorize recreation of all backend containers'
            exit 1
          fi
      - name: Validate refresh automation
        run: |
          python3 -m venv "$RUNNER_TEMP/production-validation"
          VENV_PYTHON="$RUNNER_TEMP/production-validation/bin/python"
          "$RUNNER_TEMP/production-validation/bin/pip" install --disable-pip-version-check pyyaml==6.0.3
          "$VENV_PYTHON" scripts/check-production-config.py
          "$VENV_PYTHON" scripts/validate-production-compose.py
          "$VENV_PYTHON" -m unittest discover -s deploy/production/tests -v
          bash -n deploy/production/setup-ssh.sh
          node --check deploy/production/env-preflight.mjs
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" rhysd/actionlint:1.7.7 /repo/.github/workflows/backend-env-refresh.yml
      - name: Prepare SSH identities
        env:
          VPS1_SSH_KEY: ${{ secrets.VPS1_SSH_KEY }}
          VPS2_SSH_KEY: ${{ secrets.VPS2_SSH_KEY }}
          VPS3_SSH_KEY: ${{ secrets.VPS3_SSH_KEY }}
          VPS4_SSH_KEY: ${{ secrets.VPS4_SSH_KEY }}
        run: bash deploy/production/setup-ssh.sh
      - name: Prepare candidate production ENV
        env:
          BACKEND_PRODUCTION_ENV: ${{ secrets.BACKEND_PRODUCTION_ENV }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$BACKEND_PRODUCTION_ENV" ]] || { echo '::error::Missing BACKEND_PRODUCTION_ENV'; exit 1; }
          printf '%s\n' "$BACKEND_PRODUCTION_ENV" > "$RUNNER_TEMP/handygo-shared.env"
      - name: Create and deploy config-only production release
        run: |
          set -euo pipefail
          install -d -m 700 release-output
          python3 deploy/production/refresh_env.py \
            --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --domain "$API_DOMAIN" \
            --rollout-timeout-minutes 30 \
            --env-file "$RUNNER_TEMP/handygo-shared.env" \
            2>&1 | tee release-output/deploy.log
      - name: Summarize refresh outcome
        if: always()
        run: |
          if [[ -f release-output/summary.md ]]; then
            cat release-output/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Refresh did not reach the coordinator; review the steps above.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-env-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/release-output/*.json
            backend/release-output/deploy.log
            backend/release-output/summary.md
          retention-days: 90
      - name: Remove runner-side credentials and candidate ENV
        if: always()
        run: |
          rm -f ~/.ssh/handygo_vps1 ~/.ssh/handygo_vps2 ~/.ssh/handygo_vps3 \
            ~/.ssh/handygo_known_hosts "$RUNNER_TEMP/handygo-shared.env"

  recover:
    name: Recover interrupted ENV refresh
    needs: refresh
    # A separate runner/budget also covers job timeout and ordinary cancellation.
    if: always() && github.ref == 'refs/heads/release' && ((inputs.mode == 'recover' && inputs.confirm == 'RECOVER_ENV') || (inputs.mode == 'refresh' && inputs.confirm == 'REFRESH_ALL' && (needs.refresh.result == 'failure' || needs.refresh.result == 'cancelled')))
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: production
    defaults:
      run:
        working-directory: backend
    env:
      VPS1_HOST: ${{ secrets.VPS1_HOST }}
      VPS2_HOST: ${{ secrets.VPS2_HOST }}
      VPS3_HOST: ${{ secrets.VPS3_HOST }}
      VPS4_HOST: ${{ secrets.VPS4_HOST }}
      DEPLOY_USER: azureuser
      API_DOMAIN: ${{ vars.API_DOMAIN || 'handygo.duyaivy.id.vn' }}
    steps:
      - uses: actions/checkout@v5
      - name: Prepare recovery SSH identities
        env:
          VPS1_SSH_KEY: ${{ secrets.VPS1_SSH_KEY }}
          VPS2_SSH_KEY: ${{ secrets.VPS2_SSH_KEY }}
          VPS3_SSH_KEY: ${{ secrets.VPS3_SSH_KEY }}
          VPS4_SSH_KEY: ${{ secrets.VPS4_SSH_KEY }}
        run: bash deploy/production/setup-ssh.sh
      - name: Recover exact Actions attempt from durable VPS state
        env:
          MODE: ${{ inputs.mode }}
          ORIGINAL_RUN_ID: ${{ inputs.recovery_run_id }}
          ORIGINAL_ATTEMPT: ${{ inputs.recovery_attempt }}
        run: |
          set -euo pipefail
          install -d -m 700 recovery-output
          if [[ "$MODE" == recover ]]; then
            [[ -n "$ORIGINAL_RUN_ID" && -n "$ORIGINAL_ATTEMPT" ]] || { echo '::error::Specify the original run ID and attempt'; exit 1; }
          else
            ORIGINAL_RUN_ID="$GITHUB_RUN_ID"
            ORIGINAL_ATTEMPT="$GITHUB_RUN_ATTEMPT"
          fi
          python3 deploy/production/refresh_env.py \
            --recover-only \
            --run-id "$ORIGINAL_RUN_ID" \
            --attempt "$ORIGINAL_ATTEMPT" \
            --domain "$API_DOMAIN" \
            --output recovery-output \
            2>&1 | tee recovery-output/recovery.log
      - name: Summarize recovery outcome
        if: always()
        run: |
          if [[ -f recovery-output/summary.md ]]; then
            cat recovery-output/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Recovery could not start; pending state remains protected on VPS.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-env-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/recovery-output/*.json
            backend/recovery-output/recovery.log
            backend/recovery-output/summary.md
          retention-days: 90
      - name: Remove recovery runner credentials
        if: always()
        run: |
          rm -f ~/.ssh/handygo_vps1 ~/.ssh/handygo_vps2 ~/.ssh/handygo_vps3 ~/.ssh/handygo_vps4 ~/.ssh/handygo_known_hosts
