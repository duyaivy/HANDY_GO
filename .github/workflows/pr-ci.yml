name: PR CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      ai: ${{ steps.filter.outputs.ai }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/pr-ci.yml'
              - '.github/workflows/backend-production.yml'
              - '.github/workflows/backend-production-recovery.yml'
              - '.github/workflows/backend-env-refresh.yml'
            frontend:
              - 'frontend/**'
            mobile:
              - 'mobile/**'
            ai:
              - 'ai/**'
              - '.github/workflows/ai-*.yml'

  backend-ci:
    name: Backend CI
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      wallet-migration-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wallet_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: wallet_migration_test
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U wallet_test -d wallet_migration_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python production validators
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install production config validator dependency
        run: python3 -m pip install --disable-pip-version-check pyyaml==6.0.3

      - name: Validate migration inventory and production configuration
        run: |
          python3 deploy/production/database_plan.py
          python3 scripts/check-production-config.py
          python3 scripts/validate-production-compose.py
          node --test deploy/production/tests/env-preflight.test.mjs

      - name: Generate JWT keys
        run: pnpm run keys:generate

      - name: Generate Prisma clients
        # Config parsing only; client generation does not connect to a database.
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/prisma_generate
          DATABASE_URL_MESSAGE: postgresql://ci:ci@127.0.0.1:5432/prisma_generate?schema=message
        run: pnpm run prisma:generate

      - name: Verify wallet migrations on disposable PostgreSQL
        env:
          WALLET_MIGRATION_TEST_URL: postgresql://wallet_test:local_test_only@127.0.0.1:55439/wallet_migration_test
        run: node scripts/tests/wallet-migrations.mjs

      - name: Verify all Prisma migrations and connection exhaustion on disposable PostgreSQL
        env:
          INCIDENT_DATABASE_TEST_URL: postgresql://wallet_test:local_test_only@127.0.0.1:55439/wallet_migration_test
        run: node scripts/tests/database-incident.mjs

      - name: Verify deployment migration ordering and rollback
        run: python3 -m unittest discover -s deploy/production/tests -v

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Payment Wallet Order integration with real HTTP and RabbitMQ
        env:
          NODE_ENV: test
          PAYMENT_TEST_DATABASE_URL: postgresql://handygo_test:handygo_test_pw@localhost:55433/handygo_hg51_payment_test
          DATABASE_URL_PAYMENT: postgresql://handygo_test:handygo_test_pw@localhost:55433/handygo_hg51_payment_test
          DIRECT_URL_PAYMENT: postgresql://handygo_test:handygo_test_pw@localhost:55433/handygo_hg51_payment_test
          DATABASE_URL_WALLET: postgresql://handygo_test:handygo_test_pw@localhost:55433/handygo_hg51_payment_test
          DIRECT_URL_WALLET: postgresql://handygo_test:handygo_test_pw@localhost:55433/handygo_hg51_payment_test
          DATABASE_URL_ORDER: postgresql://handygo_test:handygo_test_pw@localhost:55433/handygo_hg51_payment_test
          DIRECT_URL_ORDER: postgresql://handygo_test:handygo_test_pw@localhost:55433/handygo_hg51_payment_test
        run: |
          docker compose --env-file scripts/payment-test.env.template -f docker-compose.payment-test.yml up -d --wait
          pnpm run prisma:migrate:payment
          pnpm run prisma:migrate:wallet
          pnpm run prisma:migrate:order
          pnpm run test:integration:payment

      - name: Stop payment integration infrastructure
        if: always()
        run: docker compose --env-file scripts/payment-test.env.template -f docker-compose.payment-test.yml down -v

      - name: Build
        run: pnpm run build

      - name: Record tested backend source
        run: python3 scripts/record-ci-proof.py "$RUNNER_TEMP/backend-ci-proof/backend-proof.json"

      - name: Store backend CI proof
        uses: actions/upload-artifact@v6
        with:
          name: backend-ci-proof-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-ci-proof/backend-proof.json
          if-no-files-found: error
          retention-days: 90

  tracking-integration:
    name: HG64 Order to Tracking integration
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Install backend dependencies and create test keys
        run: |
          pnpm install --frozen-lockfile
          mkdir -p keys
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out keys/jwt-private.pem
          openssl pkey -in keys/jwt-private.pem -pubout -out keys/jwt-public.pem
          pnpm run prisma:generate:order
          pnpm run prisma:generate:tracking
          pnpm exec tsc --noEmit -p apps/tracking-service/test/tsconfig.hg64.json
          docker compose -f docker-compose.hg64-test.yml config --quiet
      - name: Start isolated HG64 Compose stack and apply migrations
        run: docker compose -f docker-compose.hg64-test.yml up --build --wait -d
      - name: Run required Order to Tracking suite
        env:
          HG64_E2E_REQUIRED: '1'
          HG64_ORDER_DATABASE_URL: postgresql://hg64:hg64_local_test@127.0.0.1:55440/hg64?schema=order_service
          HG64_TRACKING_DATABASE_URL: postgresql://hg64:hg64_local_test@127.0.0.1:55440/hg64?schema=tracking_service
          HG64_ORDER_URL: http://127.0.0.1:3304
          HG64_GATEWAY_URL: http://127.0.0.1:3300
          HG64_RABBITMQ_URL: amqp://hg64:hg64_local_test@127.0.0.1:5673
          HG64_JWT_PRIVATE_KEY_PATH: keys/jwt-private.pem
        run: pnpm exec vitest run apps/tracking-service/test/order-to-tracking.compose.spec.ts
      - uses: pnpm/action-setup@v5
        with:
          version: 10.12.3
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - name: Run mobile SSE parser and timeline contracts
        run: |
          cd ../mobile
          pnpm install --frozen-lockfile
          pnpm exec jest --runInBand --silent src/services/sse/__tests__/tracking-sse-client.test.ts src/features/tracking/__tests__/tracking.test.ts
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.hg64-test.yml logs --tail=150
      - name: Stop isolated Compose stack
        if: always()
        run: docker compose -f docker-compose.hg64-test.yml down -v --remove-orphans

  frontend-ci:
    name: Frontend CI
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  mobile-ci:
    name: Mobile CI
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run type-check

      - name: Run tests
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run test --runInBand --watchAll=false

  ai-ci:
    name: AI Service CI
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.ai == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Syntax and bytecode compilation
        run: python -m compileall app tests

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests -v

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      - detect-changes
      - backend-ci
      - tracking-integration
      - frontend-ci
      - mobile-ci
      - ai-ci
    steps:
      - name: Evaluate PR CI Gate Status
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend-ci.result }}
          TRACKING_RESULT: ${{ needs.tracking-integration.result }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend-ci.result }}
          MOBILE_CHANGED: ${{ needs.detect-changes.outputs.mobile }}
          MOBILE_RESULT: ${{ needs.mobile-ci.result }}
          AI_CHANGED: ${{ needs.detect-changes.outputs.ai }}
          AI_RESULT: ${{ needs.ai-ci.result }}
        run: |
          echo "=========================================="
          echo "       PR CI GATE EVALUATION REPORT       "
          echo "=========================================="
          echo "Change Detection Status : $DETECT_RESULT"
          echo "Backend Changed        : $BACKEND_CHANGED"
          echo "Backend Result         : $BACKEND_RESULT"
          echo "Tracking Result        : $TRACKING_RESULT"
          echo "Frontend Changed       : $FRONTEND_CHANGED"
          echo "Frontend Result        : $FRONTEND_RESULT"
          echo "Mobile Changed         : $MOBILE_CHANGED"
          echo "Mobile Result          : $MOBILE_RESULT"
          echo "AI Changed             : $AI_CHANGED"
          echo "AI Result              : $AI_RESULT"
          echo "=========================================="

          GATE_PASSED=true

          if [ "$DETECT_RESULT" != "success" ]; then
            echo "::error::Change detection failed or was cancelled."
            GATE_PASSED=false
          fi

          if [ "$BACKEND_CHANGED" = "true" ]; then
            if [ "$BACKEND_RESULT" != "success" ]; then
              echo "::error::Backend changed but Backend CI result is '$BACKEND_RESULT' (expected 'success')."
              GATE_PASSED=false
            fi
            if [ "$TRACKING_RESULT" != "success" ]; then
              echo "::error::Backend changed but HG64 integration result is '$TRACKING_RESULT' (expected 'success')."
              GATE_PASSED=false
            fi
          fi

          if [ "$FRONTEND_CHANGED" = "true" ]; then
            if [ "$FRONTEND_RESULT" != "success" ]; then
              echo "::error::Frontend changed but Frontend CI result is '$FRONTEND_RESULT' (expected 'success')."
              GATE_PASSED=false
            fi
          fi

          if [ "$MOBILE_CHANGED" = "true" ]; then
            if [ "$MOBILE_RESULT" != "success" ]; then
              echo "::error::Mobile changed but Mobile CI result is '$MOBILE_RESULT' (expected 'success')."
              GATE_PASSED=false
            fi
          fi

          if [ "$AI_CHANGED" = "true" ]; then
            if [ "$AI_RESULT" != "success" ]; then
              echo "::error::AI changed but AI CI result is '$AI_RESULT' (expected 'success')."
              GATE_PASSED=false
            fi
          fi

          if [ "$GATE_PASSED" = "true" ]; then
            echo "CI Gate passed"
            exit 0
          else
            echo "CI Gate failed"
            exit 1
          fi
