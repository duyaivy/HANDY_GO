name: PR CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
      ai: ${{ steps.filter.outputs.ai }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Detect changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/pr-ci.yml'
              - '.github/workflows/backend-production.yml'
            frontend:
              - 'frontend/**'
            mobile:
              - 'mobile/**'
            ai:
              - 'ai/**'
              - '.github/workflows/ai-*.yml'

  backend-ci:
    name: Backend CI
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate JWT keys
        run: pnpm run keys:generate

      - name: Generate Prisma clients
        run: pnpm run prisma:generate

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Record tested backend source
        run: python3 scripts/record-ci-proof.py "$RUNNER_TEMP/backend-ci-proof/backend-proof.json"

      - name: Store backend CI proof
        uses: actions/upload-artifact@v6
        with:
          name: backend-ci-proof-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend-ci-proof/backend-proof.json
          if-no-files-found: error
          retention-days: 90

  frontend-ci:
    name: Frontend CI
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  mobile-ci:
    name: Mobile CI
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.mobile == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run type-check

      - name: Run tests
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run test --runInBand --watchAll=false

  ai-ci:
    name: AI Service CI
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.ai == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Syntax and bytecode compilation
        run: python -m compileall app tests

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests -v

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      - detect-changes
      - backend-ci
      - frontend-ci
      - mobile-ci
      - ai-ci
    steps:
      - name: Evaluate PR CI Gate Status
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          BACKEND_CHANGED: ${{ needs.detect-changes.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend-ci.result }}
          FRONTEND_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend-ci.result }}
          MOBILE_CHANGED: ${{ needs.detect-changes.outputs.mobile }}
          MOBILE_RESULT: ${{ needs.mobile-ci.result }}
          AI_CHANGED: ${{ needs.detect-changes.outputs.ai }}
          AI_RESULT: ${{ needs.ai-ci.result }}
        run: |
          echo "=========================================="
          echo "       PR CI GATE EVALUATION REPORT       "
          echo "=========================================="
          echo "Change Detection Status : $DETECT_RESULT"
          echo "Backend Changed        : $BACKEND_CHANGED"
          echo "Backend Result         : $BACKEND_RESULT"
          echo "Frontend Changed       : $FRONTEND_CHANGED"
          echo "Frontend Result        : $FRONTEND_RESULT"
          echo "Mobile Changed         : $MOBILE_CHANGED"
          echo "Mobile Result          : $MOBILE_RESULT"
          echo "AI Changed             : $AI_CHANGED"
          echo "AI Result              : $AI_RESULT"
          echo "=========================================="

          GATE_PASSED=true

          if [ "$DETECT_RESULT" != "success" ]; then
            echo "::error::Change detection failed or was cancelled."
            GATE_PASSED=false
          fi

          if [ "$BACKEND_CHANGED" = "true" ]; then
            if [ "$BACKEND_RESULT" != "success" ]; then
              echo "::error::Backend changed but Backend CI result is '$BACKEND_RESULT' (expected 'success')."
              GATE_PASSED=false
            fi
          fi

          if [ "$FRONTEND_CHANGED" = "true" ]; then
            if [ "$FRONTEND_RESULT" != "success" ]; then
              echo "::error::Frontend changed but Frontend CI result is '$FRONTEND_RESULT' (expected 'success')."
              GATE_PASSED=false
            fi
          fi

          if [ "$MOBILE_CHANGED" = "true" ]; then
            if [ "$MOBILE_RESULT" != "success" ]; then
              echo "::error::Mobile changed but Mobile CI result is '$MOBILE_RESULT' (expected 'success')."
              GATE_PASSED=false
            fi
          fi

          if [ "$AI_CHANGED" = "true" ]; then
            if [ "$AI_RESULT" != "success" ]; then
              echo "::error::AI changed but AI CI result is '$AI_RESULT' (expected 'success')."
              GATE_PASSED=false
            fi
          fi

          if [ "$GATE_PASSED" = "true" ]; then
            echo "CI Gate passed"
            exit 0
          else
            echo "CI Gate failed"
            exit 1
          fi
