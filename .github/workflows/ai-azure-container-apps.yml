name: AI Service Azure Container Apps CD

on:
  push:
    branches:
      - main
      - release
    paths:
      - 'ai/**'
      - '.github/workflows/ai-azure-container-apps.yml'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force build and deploy to Azure Container Apps'
        type: boolean
        default: false

concurrency:
  group: ai-azure-container-apps-cd
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build Image & Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repo Owner for Docker Tag
        run: |
          echo "IMAGE_TAG=ghcr.io/${{ github.repository_owner }}/handygo-ai:latest" | tr '[:upper:]' '[:lower:]' >> $GITHUB_ENV

      - name: Build and Push Docker Image (Baking AI models)
        uses: docker/build-push-action@v5
        with:
          context: ./ai
          file: ./ai/Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Azure
        if: "${{ env.AZURE_CREDENTIALS != '' }}"
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy / Update Azure Container App
        if: "${{ env.AZURE_CREDENTIALS != '' }}"
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          az containerapp update \
            --name handygo-ai-service \
            --resource-group rg-handygo \
            --image ${{ env.IMAGE_TAG }} \
            --cpu 2.0 \
            --memory 4.0Gi \
            --min-replicas 0 \
            --max-replicas 2 \
            --set-env-vars "INTERNAL_SERVICE_SECRET=${{ secrets.INTERNAL_SERVICE_SECRET || 'handy-go-internal-service-secret-key-12345' }}" "DEBUG=false" "AI_SERVICE_PORT=8000"

      - name: Output Deployment Info
        run: |
          echo "## 🚀 AI Docker Image Built & Pushed to GHCR!" >> $GITHUB_STEP_SUMMARY
          echo "| Thuộc tính | Giá trị |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag** | \`${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **CPU / RAM** | 2.0 vCPU / 4.0 GiB |" >> $GITHUB_STEP_SUMMARY
          echo "| **Scale Config** | Min: 0 (Scale-to-Zero $0) - Max: 2 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Bake Models** | EasyOCR (vi, en) + InsightFace (buffalo_l) |" >> $GITHUB_STEP_SUMMARY

